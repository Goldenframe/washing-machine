<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>Стиральная машина</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body class="min-h-dvh bg-slate-950 text-slate-100 antialiased">
    <main class="mx-auto w-full max-w-5xl px-5 py-9 sm:px-10 sm:py-14">
        <div class="grid items-center gap-9 md:grid-cols-[minmax(0,1.1fr)_minmax(0,1fr)] md:gap-12">
            <div class="mx-auto w-full max-w-sm pb-2" aria-hidden="true">
                <div id="machine" data-running="false" class="group relative rounded-[1.75rem] border border-white/80 bg-linear-to-br from-white via-slate-100 to-slate-300 px-4 pt-5 pb-7 shadow-2xl shadow-black/60 sm:px-6">
                    <div class="grid grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)] items-center gap-3 border-b border-slate-300 pb-4">
                        <div>
                            <p class="mb-1 text-[0.6rem] font-bold tracking-[0.16em] text-slate-700 uppercase">Моющее средство</p>
                            <div class="grid h-6 place-items-center rounded-md border border-slate-300 bg-slate-100 shadow-sm">
                                <div class="h-1 w-6 rounded-full bg-slate-300 shadow-inner"></div>
                            </div>
                        </div>
                        <div class="relative size-12 rounded-full border-2 border-white bg-linear-to-br from-slate-50 to-slate-300 shadow-md shadow-slate-500/30">
                            <span class="absolute top-1.5 left-1/2 h-3 w-0.5 -translate-x-1/2 rounded-full bg-slate-500"></span>
                        </div>
                        <div class="min-w-0 rounded-lg bg-slate-900 px-2 py-2 text-center font-mono text-[0.65rem] font-semibold tracking-wide text-cyan-300 shadow-inner">
                            <span class="group-data-[running=true]:hidden">ГОТОВА</span>
                            <span class="hidden group-data-[running=true]:inline">СТИРКА</span>
                        </div>
                    </div>

                    <div class="relative mx-auto mt-6 grid aspect-square w-[82%] max-w-68 place-items-center rounded-full bg-linear-to-br from-white via-slate-300 to-slate-500 p-2 shadow-lg shadow-slate-600/35 ring-1 ring-slate-500/40">
                        <div class="relative grid size-full place-items-center overflow-hidden rounded-full border-[0.38rem] border-slate-800 bg-slate-950 shadow-inner">
                            <div class="absolute inset-2 rounded-full bg-linear-to-br from-slate-700 via-slate-900 to-black ring-2 ring-slate-700"></div>
                            <svg id="circle" class="relative size-[83%] text-slate-500 group-data-[running=true]:text-cyan-300/70" viewBox="0 0 160 160" fill="none">
                                <circle cx="80" cy="80" r="70" class="stroke-current opacity-55" stroke-width="3" stroke-dasharray="2 5"></circle>
                                <circle cx="80" cy="80" r="58" class="stroke-current opacity-45" stroke-width="4" stroke-dasharray="2 6"></circle>
                                <circle cx="80" cy="80" r="43" class="stroke-current opacity-35" stroke-width="3" stroke-dasharray="2 5"></circle>
                                <circle cx="80" cy="80" r="24" class="stroke-current opacity-45" stroke-width="2"></circle>
                                <path d="M80 19c13 13 19 25 16 38M133 111c-18 4-31 1-41-9M27 111c5-18 14-27 27-31" class="stroke-current opacity-90" stroke-width="6" stroke-linecap="round"></path>
                            </svg>
                            <div class="pointer-events-none absolute inset-0 rounded-full bg-linear-to-br from-white/20 via-transparent to-sky-500/10"></div>
                        </div>
                        <span class="absolute top-1/2 right-2 h-10 w-2 -translate-y-1/2 rounded-full bg-white/65 shadow-sm sm:h-14"></span>
                    </div>

                    <div class="mt-5 flex items-center justify-between">
                        <span class="font-mono text-[0.65rem] font-semibold tracking-[0.18em] text-slate-600 uppercase">Цикл 01</span>
                        <span class="h-4 w-12 rounded-sm border border-slate-300 bg-slate-200 shadow-inner"></span>
                    </div>
                    <span class="absolute -bottom-2 left-9 h-2 w-8 rounded-b-md bg-slate-600"></span>
                    <span class="absolute right-9 -bottom-2 h-2 w-8 rounded-b-md bg-slate-600"></span>
                </div>
            </div>

            <section aria-labelledby="controls-title" class="rounded-3xl border border-slate-800 bg-slate-900 p-5 shadow-xl shadow-black/20 sm:p-7">
                <h1 id="controls-title" class="text-xl font-semibold tracking-tight">Подготовка к стирке</h1>
                <p class="mt-2 text-sm leading-relaxed text-slate-300">Загрузите бельё, добавьте гель и запустите цикл.</p>

                <div class="mt-5 grid gap-2.5">
                    <button type="button" id="add-clothes" aria-pressed="false" class="flex min-h-12 cursor-pointer items-center gap-3 rounded-xl border border-slate-700 bg-slate-800 px-3.5 py-2.5 text-left text-sm font-medium transition-colors enabled:hover:bg-slate-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-cyan-300 disabled:cursor-default disabled:text-slate-400 aria-pressed:border-cyan-400/55 aria-pressed:bg-cyan-950 aria-pressed:text-cyan-100">
                        <svg aria-hidden="true" class="size-5 shrink-0 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="1.5" stroke-linejoin="round">
                            <path d="m8 4-5 3 2 5 3-1v9h8v-9l3 1 2-5-5-3a4 4 0 0 1-8 0Z"></path>
                        </svg>
                        Добавить бельё
                    </button>
                    <button type="button" id="add-detergent" aria-pressed="false" class="flex min-h-12 cursor-pointer items-center gap-3 rounded-xl border border-slate-700 bg-slate-800 px-3.5 py-2.5 text-left text-sm font-medium transition-colors enabled:hover:bg-slate-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-cyan-300 disabled:cursor-default disabled:text-slate-400 aria-pressed:border-cyan-400/55 aria-pressed:bg-cyan-950 aria-pressed:text-cyan-100">
                        <svg aria-hidden="true" class="size-5 shrink-0 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="1.5" stroke-linejoin="round">
                            <path d="M9 3h6v4l2 3v8a3 3 0 0 1-3 3h-4a3 3 0 0 1-3-3v-8l2-3V3Zm0 4h6m-8 6h10"></path>
                        </svg>
                        Добавить гель
                    </button>
                    <button type="button" id="start-wash" class="mt-1 flex min-h-12 cursor-pointer items-center justify-center gap-2 rounded-xl bg-cyan-300 px-4 py-2.5 text-sm font-bold text-slate-950 transition-colors enabled:hover:bg-cyan-200 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-cyan-300 disabled:cursor-default disabled:bg-slate-700 disabled:text-slate-300">
                        <svg aria-hidden="true" class="size-4 fill-current" viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"></path></svg>
                        Начать стирку
                    </button>
                </div>

                <div class="mt-5 rounded-xl border border-slate-800 bg-slate-950 px-4 py-3.5">
                    <p class="text-xs font-semibold tracking-[0.14em] text-cyan-300 uppercase">Статус</p>
                    <div role="status" aria-atomic="true" class="mt-1 min-h-12 text-sm leading-relaxed">
                        <p id="status" class="text-slate-100">Ожидание действий…</p>
                        <p id="special-message" class="hidden text-cyan-300"></p>
                    </div>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
